services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: enterprise-support-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: enterprise_support
      POSTGRES_USER: support_admin
      POSTGRES_PASSWORD: support_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: enterprise-support-api
    environment:
      DATABASE_URL: postgresql+psycopg://support_admin:support_password@postgres:5432/enterprise_support
    restart: unless-stopped

    ports:
      - "8000:8000"

    depends_on:
      - postgres

volumes:
  postgres_data: